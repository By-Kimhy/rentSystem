# Lint, type-check, test (against a real MySQL) and build the web app and API on every
# pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rentsystem
          MYSQL_USER: rent
          MYSQL_PASSWORD: rent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://rent:rent@127.0.0.1:3306/rentsystem
      SESSION_SECRET: ci-session-secret-ci-session-secret
      CRON_SECRET: ci-cron-secret
      UPLOAD_DIR: ./uploads
      BILLING_TIMEZONE: UTC
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Also runs `prisma generate` (server postinstall).
      - run: npm ci

      - name: Apply migrations
        run: npm run db:deploy

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
